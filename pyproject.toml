[project]
name = "pbq"
version = "0.1.0"
description = "Palheta & Baqueta: transforma MP3s em músicas jogáveis (stems + charts) para o jogo em Godot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mutagen==1.48.1",
    "numpy==2.4.6",
]

[project.optional-dependencies]
# Extras por etapa (como no kraoke): o núcleo e os testes rápidos não precisam de torch.
# torch 2.8.0: a mesma do kraoke (cache do uv compartilhado no Deck).
separate = ["demucs==4.1.0", "torch==2.8.0"]
# beat_this (MIT): batidas e compassos; torchaudio casado com o torch (mesmo índice só-CPU).
beats = ["beat-this==1.1.0", "torch==2.8.0", "torchaudio==2.8.0"]
# Bateria: rede ADTOF implementada aqui (pbq/models/adtof.py); só precisa de torch.
drums = ["torch==2.8.0"]
ai = ["pbq[separate,beats,drums]"]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "gdtoolkit==4.5.0",
]

[project.scripts]
pbq = "pbq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pbq*"]

[tool.uv]
# Só Linux (Steam Deck e CI): no macOS Intel o Demucs exige numpy < 2 e torch < 2.3.
environments = ["sys_platform == 'linux'"]

# PyTorch só-CPU: o Deck não tem CUDA e as wheels padrão trazem ~3 GB de libs NVIDIA (ADR 0004).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --- testes ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tools/ (ferramentas de dev) não é instalado como pacote
markers = [
    "slow: roda modelos de IA reais (minutos, baixa modelos); fora da CI rápida",
]
addopts = [
    "-m", "not slow",
    "--cov=pbq",
    "--cov=tools",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# --- qualidade ---------------------------------------------------------------

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Comentários e mensagens são em português: aspas e travessões tipográficos são intencionais.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Títulos de vídeo reais (casos do kraoke): quebrar a string esconderia o caso testado.
"tests/test_titles.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["pbq", "tools"]
strict = true

[[tool.mypy.overrides]]
# Sem tipos publicados; usados só dentro dos adaptadores de pbq/models/.
module = ["demucs.*", "mutagen.*", "beat_this.*"]
ignore_missing_imports = true
