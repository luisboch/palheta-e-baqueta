# Configuração do backend. Copie para config.toml (não versionado) para mudar algo.
# Sem config.toml, vale este arquivo. Cada valor vem comentado com o motivo.

[paths]
input = "data/input"      # MP3s a processar (o menu do pendrive copia para cá)
work = "data/work"        # intermediários + estado por música (<id>/song.json)
library = "data/library"  # saída final, lida pelo jogo (contrato: docs/library-format.md)
state = "data"            # eventos do worker, lock, ajustes do jogo

[watch]
interval = 5            # segundos entre verificações de data/input
nice = 19               # prioridade do worker (19 = mais baixa): o jogo não pode engasgar
torch_threads = 4       # núcleos físicos do Deck; no kraoke, SMT (6-8) não acelerou e 3 foi ~18% mais lento

[drive]
# roots = ["/run/media/deck"]  # onde procurar pendrives; padrão: /run/media/<usuário> (SteamOS) e /media/<usuário> (Ubuntu)
# Pasta na raiz do pendrive: MP3s para processar + library/ (músicas prontas).
# Separada da "kraoke/" para um pendrive servir aos dois sem um pegar os arquivos do outro.
folder = "palheta"

[stages.separate]
engine = "demucs"
model = "htdemucs_6s"   # o único Demucs com stem de guitarra; 5 min de música = ~130 s na CPU do Deck
device = "cpu"          # "cuda" em PC com GPU NVIDIA; no Deck, só CPU (ADR 0004)
shifts = 1              # 2+ melhora pouco a separação e multiplica o tempo

[stages.presence]
relative_db = -18.0     # stem "audível" num quadro: até 18 dB abaixo da mixagem (vazamento fica a 25-35)
floor_db = -50.0        # e acima de -50 dBFS
# Tocando em pelo menos 15% da música (sem os silêncios). Casos reais: ausente 12% (bateria de
# More Than Words, o percussivo do violão) e presente 16% (guitarra de Black Magic): pouca folga.
min_active = 0.15
min_onsets = 30.0       # ataques por minuto: menos que isso não dá um chart jogável
# Guitarra distorcida é comprimida: em Anna Júlia, 3 dB achava 12 ataques/min numa palhetada de
# ~216/min e 1 dB achava 141. Bateria dá quase o mesmo com 1 ou 3 dB.
onset_delta = 1.0

[stages.beats]
tracker = "beat_this"   # MIT; pesos do servidor dos autores, no cache do torch.hub
checkpoint = "final0"   # o modelo padrão dos autores (treinado em tudo menos o GTZAN)
device = "cpu"

[stages.drums_chart]
transcriber = "adtof"   # pesos CC BY-NC-SA 4.0 (projeto não comercial, ADR 0011); ~4 MB em data/models
device = "cpu"          # 4 a 7 s por música no Deck

[stages.pitched_chart]
transcriber = "basic_pitch"  # Spotify, Apache-2.0; modelo ONNX do pacote, 5 a 8 s por stem no Deck

[stages.package]
audio_quality = 6       # Vorbis 0-10 (6 ≈ 192 kbps); um OGG por instrumento presente + o fundo
